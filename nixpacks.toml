[phases.setup]
nixPkgs = ["php84", "php84Extensions.zip", "composer"]

[phases.build]
cmds = ["cd backend/dono-api && composer install --no-dev --optimize-autoloader"]

[start]
# Set PROCESS_ROLE=web, queue, or scheduler per Railway service.
cmd = "cd backend/dono-api && if [ \"${PROCESS_ROLE:-web}\" = \"queue\" ]; then php artisan queue:work --sleep=3 --tries=3 --timeout=120 --max-time=3600; elif [ \"${PROCESS_ROLE:-web}\" = \"scheduler\" ]; then php artisan schedule:work; else php artisan serve --host=0.0.0.0 --port=${PORT:-8000}; fi"
